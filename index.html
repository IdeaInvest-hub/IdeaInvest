<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IdeaInvest V3 — Fueling Innovation</title><style>
:root{--n:#062b57;--g:#38c84a;--bg:#f4f7fb;--mut:#64748b;--line:#e1e9f2}*{box-sizing:border-box}body{margin:0;font:15px/1.5 Arial,sans-serif;background:var(--bg);color:#17283d}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{background:var(--n);color:white;padding:17px 4%;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0}.brand{font-size:1.4rem;font-weight:800}.brand b{color:var(--g)}.tagline{font-size:.65rem;letter-spacing:2px;color:#c8d8e8}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:bold}.green{background:var(--g);color:#07351a}.light{background:#edf3f8;color:var(--n)}.layout{max-width:1250px;margin:auto;padding:24px 4%;display:grid;grid-template-columns:210px 1fr;gap:22px}.side,.panel,.stat,.project{background:white;border:1px solid var(--line);border-radius:15px}.side{padding:10px;height:max-content;position:sticky;top:88px}.nav{display:block;text-align:left;width:100%;border:0;background:white;padding:12px;border-radius:9px;color:#53657b}.nav.active,.nav:hover{background:#eaf8ec;color:#187a2a;font-weight:bold}.side small{display:block;color:#9aa7b6;padding:12px 10px 4px;text-transform:uppercase;letter-spacing:1px}.main{min-width:0}.head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}.head h1{margin:0;color:var(--n);font-size:1.8rem}.muted{color:var(--mut)}.banner{background:linear-gradient(120deg,#062b57,#0d5474);color:white;padding:25px;border-radius:17px;margin-bottom:18px}.banner h2{margin:0 0 6px}.banner p{margin:0;color:#d5e4f2}.stats,.cards,.cols{display:grid;gap:15px}.stats{grid-template-columns:repeat(4,1fr);margin-bottom:18px}.stat{padding:17px}.stat small{color:var(--mut)}.stat strong{display:block;font-size:1.5rem;color:var(--n);margin:5px 0}.panel{padding:20px;margin-bottom:18px}.cards{grid-template-columns:repeat(3,minmax(0,1fr))}.project{overflow:hidden}.cover{background:linear-gradient(135deg,#0b3d78,#168153);padding:17px;color:white;min-height:105px;display:flex;flex-direction:column;justify-content:space-between}.cover.energy{background:linear-gradient(135deg,#16416c,#4d9caa)}.cover.factory{background:linear-gradient(135deg,#303c64,#7b8a4c)}.pill{background:#e5f8e8;color:#187a2a;border-radius:99px;padding:4px 8px;font-size:.72rem;font-weight:bold;width:max-content}.pill.review{background:#e9f0ff;color:#315c9a}.body{padding:16px}.body h3{margin:8px 0;color:var(--n)}.body p{font-size:.88rem;color:var(--mut);min-height:42px}.progress{height:7px;background:#e7edf3;border-radius:8px;overflow:hidden;margin:9px 0}.progress i{display:block;background:var(--g);height:100%}.row{display:flex;justify-content:space-between;gap:10px;font-size:.82rem}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.cols{grid-template-columns:1.2fr .8fr}.field{margin:0 0 13px}.field label{display:block;font-size:.85rem;font-weight:bold;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid #cfdae6;border-radius:9px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.full{grid-column:1/-1}.notice{background:#fff5dc;border:1px solid #f0d79c;color:#775317;padding:12px;border-radius:10px;margin-bottom:15px;font-size:.85rem}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:560px}td,th{text-align:left;padding:11px;border-bottom:1px solid var(--line);font-size:.86rem}th{color:var(--mut);font-size:.75rem}.empty{text-align:center;padding:30px;color:var(--mut)}.modalbg{position:fixed;inset:0;background:#061a31aa;display:grid;place-items:center;padding:16px;z-index:10}.modal{background:white;border-radius:16px;padding:24px;width:min(520px,100%);max-height:90vh;overflow:auto}.close{float:right;border:0;padding:7px;border-radius:7px}.toast{position:fixed;bottom:18px;right:18px;background:#0b3d25;color:white;padding:13px 17px;border-radius:10px;z-index:20}.foot{text-align:center;color:#8997a8;padding:20px;font-size:.8rem}
@media(max-width:900px){.layout{grid-template-columns:1fr}.side{position:static;display:flex;overflow:auto}.side small{display:none}.nav{white-space:nowrap;width:auto}.stats{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}}
@media(max-width:560px){.cards,.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.head{display:block}.head button{margin-top:10px}.stats{gap:9px}.stat{padding:12px}.cards{grid-template-columns:1fr}.top{padding:13px 4%}}
</style></head><body><header class="top"><div><div class="brand">Idea<b>Invest</b></div><div class="tagline">FUELING INNOVATION</div></div><div><span id="who" style="margin-right:10px">Demo User · Investor</span><button class="btn green" onclick="account()">Profile / Role</button></div></header><div class="layout"><aside class="side"><small>Workspace</small><button class="nav active" data-p="overview" onclick="go('overview')">▦ Overview</button><button class="nav" data-p="opportunities" onclick="go('opportunities')">◈ Opportunities</button><button class="nav" data-p="submit" onclick="go('submit')">＋ Submit an idea</button><button class="nav" data-p="portfolio" onclick="go('portfolio')">▤ My portfolio</button><button class="nav" data-p="updates" onclick="go('updates')">✉ Updates</button><small>Management</small><button class="nav" data-p="admin" onclick="go('admin')">⚙ Admin review</button></aside><main class="main" id="main"></main></div><div class="foot">© 2026 IdeaInvest · V3 front-end prototype · No real investments or payments are processed.</div><div id="modal"></div><div id="toast"></div>
<script>
const demo=[{id:1,name:"AgriTech Solutions",sector:"Agriculture",stage:"Seed",ask:45000000,summary:"Smart farming and local crop-processing concept designed to improve productivity and market access.",location:"Bauchi, Nigeria",status:"Approved for showcase",owner:"Demo Innovator",raised:18000000},{id:2,name:"Clean Energy Hub",sector:"Energy",stage:"Growth",ask:120000000,summary:"Distributed clean-energy solutions for small businesses and productive-use customers.",location:"Northern Nigeria",status:"Under review",owner:"Demo Innovator",raised:42000000},{id:3,name:"Local Manufacturing Works",sector:"Manufacturing",stage:"Scale-up",ask:85000000,summary:"A light-manufacturing concept to develop local supply chains and skilled jobs.",location:"Nigeria",status:"Approved for showcase",owner:"Demo Innovator",raised:51000000}];
let projects=JSON.parse(localStorage.ii3projects||"null")||demo,role=localStorage.ii3role||"Investor",profile=JSON.parse(localStorage.ii3profile||"null")||{name:"Demo User",email:"demo@ideainvest.example"},page="overview";
const money=n=>new Intl.NumberFormat("en-NG",{style:"currency",currency:"NGN",maximumFractionDigits:0}).format(n||0);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function save(){localStorage.ii3projects=JSON.stringify(projects);localStorage.ii3role=role;localStorage.ii3profile=JSON.stringify(profile)}
function toast(s){document.getElementById("toast").innerHTML='<div class="toast">'+esc(s)+'</div>';setTimeout(()=>document.getElementById("toast").innerHTML="",2800)}
function go(p){page=p;document.querySelectorAll(".nav").forEach(b=>b.classList.toggle("active",b.dataset.p===p));render()}
function head(t,d,btn=""){return `<div class="head"><div><h1>${t}</h1><div class="muted">${d}</div></div>${btn}</div>`}
function card(p){let pct=Math.min(100,Math.round(p.raised/Math.max(p.ask,1)*100));return `<article class="project"><div class="cover ${p.sector==="Energy"?"energy":p.sector==="Manufacturing"?"factory":""}"><span class="pill">${esc(p.sector)}</span><div><small>${esc(p.stage)} stage</small><h3 style="color:white;margin:2px 0">${esc(p.name)}</h3></div></div><div class="body"><p>${esc(p.summary)}</p><div class="row"><span>Funding target</span><b>${money(p.ask)}</b></div><div class="progress"><i style="width:${pct}%"></i></div><div class="row"><span>Illustrative interest</span><b>${pct}%</b></div><div class="actions"><button class="btn light" onclick="detail(${p.id})">Details</button>${role==="Investor"?`<button class="btn green" onclick="interest(${p.id})">Express interest</button>`:""}</div></div></article>`}
function render(){document.getElementById("who").textContent=profile.name+" · "+role;let m=document.getElementById("main");
if(page==="overview")m.innerHTML=head("Welcome, "+esc(profile.name.split(" ")[0]),"Your IdeaInvest workspace.",'<button class="btn green" onclick="go(\'submit\')">＋ Submit an idea</button>')+`<div class="banner"><h2>Great ideas deserve a path to industry.</h2><p>Discover opportunities, prepare projects for review, and connect innovation with investment and industrial partners.</p></div><div class="stats"><div class="stat"><small>Listed opportunities</small><strong>${projects.length}</strong><small>Across sectors</small></div><div class="stat"><small>Sectors represented</small><strong>${new Set(projects.map(p=>p.sector)).size}</strong><small>Innovation themes</small></div><div class="stat"><small>Your workspace</small><strong style="font-size:1.2rem">${esc(role)}</strong><small>Switch in profile</small></div><div class="stat"><small>Platform stage</small><strong style="font-size:1.2rem">Prototype</strong><small>Demo data only</small></div></div><div class="panel"><div class="head"><h2>Featured opportunities</h2><button class="btn light" onclick="go('opportunities')">View all →</button></div><div class="cards">${projects.slice(0,3).map(card).join("")}</div></div><div class="cols"><div class="panel"><h2>How IdeaInvest works</h2><p><b>01 · Submit or discover</b><br><span class="muted">Innovators share structured proposals; investors browse opportunities.</span></p><p><b>02 · Review and connect</b><br><span class="muted">Assess project information before any investment decision.</span></p><p><b>03 · Build and scale</b><br><span class="muted">Connect ventures with capital, expertise and industrial partners.</span></p></div><div class="panel"><h2>Prototype notice</h2><div class="notice">Sample projects only. No real investment offers, payments or approvals occur in this demo.</div><button class="btn light" onclick="go('updates')">Read platform updates</button></div></div>`;
else if(page==="opportunities")m.innerHTML=head("Opportunity marketplace","Explore project concepts and their summaries.",'<button class="btn green" onclick="go(\'submit\')">＋ Submit an idea</button>')+'<div class="notice">Sample listings and figures are illustrative, not verified investment data.</div><div class="cards">'+projects.map(card).join("")+'</div>';
else if(page==="submit")m.innerHTML=head("Submit an idea","Create a project profile for initial screening.")+`<div class="notice">Do not enter confidential inventions or sensitive personal information. This demo saves data only in this browser.</div><div class="panel"><form onsubmit="submitProject(event)"><div class="formgrid"><div class="field"><label>Project name *</label><input id="pn" required maxlength="90" placeholder="Regional Food Processing Hub"></div><div class="field"><label>Sector *</label><select id="ps" required><option value="">Select sector</option><option>Agriculture</option><option>Energy</option><option>Manufacturing</option><option>Technology</option><option>Healthcare</option><option>Logistics</option><option>Education</option><option>Other</option></select></div><div class="field"><label>Development stage *</label><select id="stage" required><option value="">Select stage</option><option>Idea</option><option>Prototype</option><option>Seed</option><option>Growth</option><option>Scale-up</option></select></div><div class="field"><label>Indicative funding need (NGN) *</label><input id="ask" type="number" min="1" required placeholder="25000000"></div><div class="field"><label>Project location</label><input id="loc" placeholder="City, country"></div><div class="field"><label>Founder / organization</label><input id="owner" value="${esc(profile.name)}"></div><div class="field full"><label>Project summary *</label><textarea id="sum" required maxlength="1200" placeholder="Problem, solution, customers and scale potential"></textarea></div><div class="field full"><label><input id="confirm" type="checkbox" required style="width:auto"> I confirm this is an accurate summary and understand this is not a funding offer.</label></div></div><button class="btn green">Save project for review</button></form></div>`;
else if(page==="portfolio"){let watch=JSON.parse(localStorage.ii3watch||"[]"),mine=role==="Investor"?projects.filter(p=>watch.includes(p.id)):projects.filter(p=>p.owner===profile.name);m.innerHTML=head(role==="Investor"?"My portfolio":"My submitted projects","Your demo watchlist or submitted project concepts.")+'<div class="notice">No investments or transactions are made. Expressing interest only saves a local demo watchlist.</div>'+(mine.length?'<div class="cards">'+mine.map(card).join("")+'</div>':'<div class="panel empty"><h2>Nothing here yet</h2><p>Explore opportunities or submit a project to get started.</p><button class="btn green" onclick="go(\''+(role==="Investor"?"opportunities":"submit")+'\')">Get started</button></div>')}
else if(page==="updates")m.innerHTML=head("Updates & guidance","Important information about the prototype.")+`<div class="panel"><h3>Welcome to IdeaInvest V3</h3><p>Explore projects, submit a concept, and switch roles from your profile.</p><hr><h3>Investment compliance comes first</h3><p>Real investment activity requires specialist legal and regulatory review, investor disclosures, privacy/security controls and appropriate KYC/AML processes.</p><hr><h3>Demo data is local</h3><p>This prototype uses browser storage. Data is not shared across devices or users and there is no secure central database.</p></div>`;
else if(page==="admin")m.innerHTML=head("Admin review","Demo queue for screening submitted concepts.")+'<div class="notice">Demo-only administration without secure admin authentication. Do not use for real investment decisions.</div><div class="panel tablewrap"><table><thead><tr><th>Project</th><th>Sector</th><th>Owner</th><th>Funding ask</th><th>Status</th><th>Action</th></tr></thead><tbody>'+projects.map(p=>`<tr><td><b>${esc(p.name)}</b><br>${esc(p.stage)}</td><td>${esc(p.sector)}</td><td>${esc(p.owner)}</td><td>${money(p.ask)}</td><td><span class="pill ${p.status.includes("review")||p.status==="Pending review"?"review":""}">${esc(p.status)}</span></td><td><button class="btn light" onclick="review(${p.id})">Review</button></td></tr>`).join("")+'</tbody></table></div>';
}
function submitProject(e){e.preventDefault();projects.unshift({id:Date.now(),name:pn.value.trim(),sector:ps.value,stage:stage.value,ask:Number(ask.value),summary:sum.value.trim(),location:loc.value.trim()||"Not specified",owner:owner.value.trim()||profile.name,status:"Pending review",raised:0});save();toast("Project saved in this browser.");go("portfolio")}
function detail(id){let p=projects.find(x=>x.id===id);document.getElementById("modal").innerHTML=`<div class="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal"><button class="close" onclick="closeModal()">✕</button><span class="pill">${esc(p.sector)}</span><h2>${esc(p.name)}</h2><p>${esc(p.summary)}</p><p><b>Stage:</b> ${esc(p.stage)}<br><b>Indicative target:</b> ${money(p.ask)}<br><b>Location:</b> ${esc(p.location)}<br><b>Status:</b> ${esc(p.status)}</p><div class="notice">Illustrative listing only. Verify all claims independently; this is not a recommendation or offer to invest.</div><button class="btn light" onclick="closeModal()">Close</button> ${role==="Investor"?`<button class="btn green" onclick="closeModal();interest(${p.id})">Express interest</button>`:""}</div></div>`}
function interest(id){let w=JSON.parse(localStorage.ii3watch||"[]");if(!w.includes(id))w.push(id);localStorage.ii3watch=JSON.stringify(w);toast("Interest saved locally — no investment was made.");go("portfolio")}
function review(id){let p=projects.find(x=>x.id===id);document.getElementById("modal").innerHTML=`<div class="modalbg"><div class="modal"><button class="close" onclick="closeModal()">✕</button><h2>Review: ${esc(p.name)}</h2><div class="field"><label>Demo status</label><select id="status"><option>Pending review</option><option>Under review</option><option>Approved for showcase</option><option>Needs more information</option><option>Rejected</option></select></div><button class="btn green" onclick="projects.find(x=>x.id===${id}).status=document.getElementById('status').value;save();closeModal();render();toast('Demo status updated')">Save status</button></div></div>`;document.getElementById("status").value=p.status}
function closeModal(){document.getElementById("modal").innerHTML=""}
function account(){document.getElementById("modal").innerHTML=`<div class="modalbg" onclick="if(event.target===this)closeModal()"><div class="modal"><button class="close" onclick="closeModal()">✕</button><h2>Profile & role preview</h2><p class="muted">This is a role preview, not secure authentication.</p><form onsubmit="saveAccount(event)"><div class="field"><label>Display name</label><input id="name" required value="${esc(profile.name)}"></div><div class="field"><label>Email</label><input id="email" type="email" required value="${esc(profile.email)}"></div><div class="field"><label>Preview workspace</label><select id="role"><option>Investor</option><option>Innovator</option><option>Admin</option><option>Industrial Partner</option></select></div><button class="btn green">Save profile</button></form></div></div>`;document.getElementById("role").value=role}
function saveAccount(e){e.preventDefault();profile={name:document.getElementById("name").value.trim(),email:document.getElementById("email").value.trim()};role=document.getElementById("role").value;save();closeModal();render();toast("Demo profile updated")}
save();render();
</script></body></html>
